name: Publish package
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upstream:
        description: Promote a verified automatic upstream candidate
        type: boolean
        default: false

env:
  UPSTREAM_UPDATE: ${{ inputs.upstream || false }}

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .build/llvm
            .build/emsdk
          key: llvm-x86-sources-${{ runner.os }}-${{ hashFiles('upstream.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .build/host
            .build/wasm
            .build/bridge
          key: llvm-x86-build-${{ runner.os }}-${{ hashFiles('upstream.json', 'scripts/build-wasm.sh', 'scripts/prepare-mc.mjs', 'scripts/subtarget-storage.mjs', 'native/CMakeLists.txt') }}
      - run: sudo apt-get update && sudo apt-get install -y ninja-build cmake
      - name: Verify release maintenance
        run: node --test test/release-assets.test.mjs test/release-workflow.test.mjs test/upstream-release.test.mjs test/upstream-promotion.test.mjs test/registry-release.test.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run build:wasm
      - run: npm run verify:licenses
      - run: python3 -m unittest discover -s test -p '*_test.py'
      - run: npm run test:coverage
      - run: npm run test:types
      - run: npm run test:mutation
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run verify:package
      - name: Verify exact release tarball
        run: |
          npm pack --ignore-scripts --json > pack-result.json
          node scripts/test-tarball.mjs
          sha256sum "$(node -p 'require("./pack-result.json")[0].filename')" > package.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-${{ github.sha }}
          if-no-files-found: error
          path: |
            *.tgz
            package.sha256
            pack-result.json
            dist/build-info.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: footprint-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .build/bridge/llvm-x86.map
            .build/bridge/archive-inputs.tsv
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: package-${{ github.sha }}
      - name: Verify tag and tarball
        run: |
          if [ "$UPSTREAM_UPDATE" != true ]; then
            test "$GITHUB_REF_TYPE" = tag
            test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          fi
          sha256sum --check package.sha256
          node scripts/test-tarball.mjs
      - name: Promote verified upstream candidate
        if: github.event_name == 'workflow_dispatch' && inputs.upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/promote-upstream.mjs
      - name: Check immutable npm release
        id: registry
        run: node scripts/check-release.mjs
      - name: Publish tested artifact with npm OIDC
        if: steps.registry.outputs.exists == 'false'
        run: npm publish "$(node -p 'require("./pack-result.json")[0].filename')" --ignore-scripts --access public --provenance
      - name: Create or verify immutable GitHub release
        run: node scripts/publish-release.mjs dist/build-info.json
        env:
          GH_TOKEN: ${{ github.token }}
